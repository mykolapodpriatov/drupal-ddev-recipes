; Route PHP's mail() through the Mailpit binary shipped in the web image.
;
; DDEV ^1.23 runs Mailpit as a process inside the web container (supervisord
; program "mailpit"), not as a compose service. The image does not ship
; mhsendmail. Its own php.ini uses this same command, aimed at 127.0.0.1
; because that is where Mailpit listens. A project-level override replaces
; that default, so a stale binary or a hostname of "mailpit" makes mail()
; fail instead of being captured.

sendmail_path = "/usr/local/bin/mailpit sendmail -t --smtp-addr 127.0.0.1:1025"

; Make sure SMTP transport in PHP itself is sane (rarely used but cheap).
SMTP = mailpit
smtp_port = 1025
